name: Build Android APK

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: 拉取代码
        uses: actions/checkout@v4

      - name: 安装 Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: 安装 JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: 安装 Android SDK
        uses: android-actions/setup-android@v3

      - name: 安装 SDK 组件
        run: sdkmanager "platforms;android-35" "build-tools;35.0.0" "platform-tools"

      - name: 安装依赖
        run: npm ci

      - name: 同步网页资源到安卓工程
        run: npx cap sync android

      - name: 编译 Debug APK
        run: |
          chmod +x android/gradlew
          cd android && ./gradlew assembleDebug --no-daemon --stacktrace

      - name: 上传构建产物
        uses: actions/upload-artifact@v4
        with:
          name: shangan-apk
          path: android/app/build/outputs/apk/debug/*.apk

      - name: 发布 Release（手机可直接下载）
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ github.run_number }}
          name: 上岸计划 v${{ github.run_number }}
          body: |
            安装方法：手机浏览器打开本页，点 apk 下载，允许安装未知来源应用。
          files: android/app/build/outputs/apk/debug/app-debug.apk

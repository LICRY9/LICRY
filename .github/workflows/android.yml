name: Build Android APK

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: 拉取代码
        uses: actions/checkout@v4

      - name: 安装 Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: 安装 JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: 准备 Android SDK
        run: |
          SDK="${ANDROID_HOME:-$ANDROID_SDK_ROOT}"
          if [ -z "$SDK" ] || [ ! -d "$SDK" ]; then SDK=/usr/local/lib/android/sdk; fi
          echo "SDK 目录: $SDK"
          echo "已装 platforms:"; ls "$SDK/platforms" 2>/dev/null || true
          echo "已装 build-tools:"; ls "$SDK/build-tools" 2>/dev/null || true
          SDKM=$(ls "$SDK"/cmdline-tools/*/bin/sdkmanager 2>/dev/null | head -1)
          echo "sdkmanager: $SDKM"
          if [ -n "$SDKM" ]; then
            yes | "$SDKM" --licenses >/dev/null 2>&1 || true
            NEED=""
            [ -d "$SDK/platforms/android-35" ] || NEED="$NEED platforms;android-35"
            [ -d "$SDK/build-tools/35.0.0" ] || NEED="$NEED build-tools;35.0.0"
            if [ -n "$NEED" ]; then
              echo "需要安装:$NEED"
              "$SDKM" $NEED
            else
              echo "所需组件均已存在，跳过下载"
            fi
          fi
          echo "ANDROID_HOME=$SDK" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$SDK" >> "$GITHUB_ENV"
          echo "SDK_DIR=$SDK" >> "$GITHUB_ENV"

      - name: 安装依赖
        run: npm ci

      - name: 同步网页资源到安卓工程
        run: npx cap sync android

      - name: 指定 SDK 路径
        run: echo "sdk.dir=$SDK_DIR" > android/local.properties

      - name: 编译 Debug APK
        run: |
          chmod +x android/gradlew
          cd android && ./gradlew assembleDebug --no-daemon --stacktrace

      - name: 上传构建产物
        uses: actions/upload-artifact@v4
        with:
          name: shangan-apk
          path: android/app/build/outputs/apk/debug/*.apk

      - name: 发布 Release（手机可直接下载）
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ github.run_number }}
          name: 上岸计划 v${{ github.run_number }}
          body: |
            安装方法：手机浏览器打开本页，点 apk 下载，允许安装未知来源应用。
          files: android/app/build/outputs/apk/debug/app-debug.apk

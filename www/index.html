<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, maximum-scale=1.0, user-scalable=no" />
<meta name="theme-color" content="#F2EDE0" />
<meta name="apple-mobile-web-app-capable" content="yes" />
<title>上岸计划</title>
<link rel="manifest" href="manifest.json" />
<link rel="icon" href="icon.svg" />
<link rel="stylesheet" href="styles.css" />
</head>
<body>
<div id="app">
  <header class="topbar">
    <div class="brand">
      <span class="brand-mark"></span>
      <span>上岸计划</span>
    </div>
    <div class="topbar-date" id="topbarDate"></div>
  </header>

  <main class="view" id="view"></main>

  <button class="fab" id="fab" aria-label="添加任务">
    <svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round">
      <path d="M12 5v14M5 12h14" />
    </svg>
  </button>

  <nav class="tabbar" id="tabbar">
    <button class="tab" data-tab="today">
      <svg viewBox="0 0 24 24" width="21" height="21" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round">
        <rect x="3" y="5" width="18" height="16" rx="3" /><path d="M8 3v4M16 3v4M3 10h18" />
      </svg>
      <span>今天</span>
    </button>
    <button class="tab" data-tab="plan">
      <svg viewBox="0 0 24 24" width="21" height="21" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round">
        <circle cx="12" cy="12" r="9" /><path d="M12 7v5l3 2" />
      </svg>
      <span>规划</span>
    </button>
    <button class="tab" data-tab="long">
      <svg viewBox="0 0 24 24" width="21" height="21" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round">
        <path d="M4 6h16M4 12h16M4 18h10" />
      </svg>
      <span>长期</span>
    </button>
    <button class="tab" data-tab="stats">
      <svg viewBox="0 0 24 24" width="21" height="21" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round">
        <path d="M4 19V9M10 19V5M16 19v-6M22 19H2" />
      </svg>
      <span>数据</span>
    </button>
  </nav>
</div>

<div class="mask" id="mask"></div>
<div class="sheet" id="sheet" role="dialog" aria-modal="true" aria-label="操作面板"></div>
<div class="toast" id="toast"></div>

<script src="app.js"></script>
</body>
</html>
